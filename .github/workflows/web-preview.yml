name: Web preview

# Publishes each PR's web UI to GitHub Pages at
# https://retsam.github.io/hanabi/pr-preview/pr-<number>/ and removes it when
# the PR closes. Needs Settings → Pages → "Deploy from a branch" → gh-pages.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs get a read-only token and can't push to gh-pages
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: github.event.action != 'closed'
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event.action != 'closed'
      - run: pnpm --filter @hanabi/web build
        if: github.event.action != 'closed'
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: apps/web/dist
